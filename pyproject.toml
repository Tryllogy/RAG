[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-project"
version = "0.1.0"
description = "RAG (Retrieval-Augmented Generation) Project"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "fire",
    "langchain_ollama",
    "langchain-text-splitters",
    "langchain_community",
    "bm25",
    "rank_bm25",
    "tqdm",
    "scikit-learn"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
